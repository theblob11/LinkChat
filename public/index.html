<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LinkChat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   LOGIN
========================================================= */

#login {

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.login-box {

    width: 100%;

    max-width: 430px;

    background: #1e293b;

    padding: 35px;

    border-radius: 18px;
}

.logo {

    font-size: 32px;

    font-weight: bold;
}

.subtitle {

    color: #94a3b8;

    margin:
        8px 0 25px;
}

label {

    display: block;

    margin:
        16px 0 7px;
}

input {

    width: 100%;

    padding: 13px;

    border:
        1px solid #475569;

    border-radius: 10px;

    background: #0f172a;

    color: white;

    outline: none;
}

input:focus {

    border-color:
        #60a5fa;
}

.password-help {

    color:
        #94a3b8;

    font-size:
        12px;

    margin-top:
        6px;
}

#joinButton {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background:
        #3b82f6;

    color: white;

    font-weight: bold;
}

#joinButton:hover {

    background:
        #2563eb;
}

/* =========================================================
   CHAT
========================================================= */

#chat {

    display: none;

    height: 100vh;

    flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

header {

    height: 72px;

    flex-shrink: 0;

    background:
        #1e293b;

    border-bottom:
        1px solid #334155;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 18px;
}

.chat-title {

    font-size:
        20px;

    font-weight:
        bold;
}

.status {

    font-size:
        12px;

    margin-top:
        4px;
}

.connected {

    color:
        #4ade80;
}

.disconnected {

    color:
        #f87171;
}

.connecting {

    color:
        #facc15;
}

#copyButton {

    border: 0;

    background:
        #334155;

    color: white;

    padding:
        10px 14px;

    border-radius:
        9px;
}

#copyButton:hover {

    background:
        #475569;
}

/* =========================================================
   MAIN
========================================================= */

.chat-area {

    flex: 1;

    display: flex;

    min-height: 0;
}

/* =========================================================
   MESSAGES
========================================================= */

#messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.message {

    max-width:
        75%;

    background:
        #1e293b;

    padding:
        11px 14px;

    border-radius:
        14px;

    margin-bottom:
        15px;
}

.message.mine {

    margin-left:
        auto;

    background:
        #2563eb;
}

.name {

    font-size:
        12px;

    color:
        #93c5fd;

    font-weight:
        bold;

    margin-bottom:
        5px;
}

.mine .name {

    color:
        #dbeafe;
}

.message-text {

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;
}

.message-time {

    font-size:
        10px;

    color:
        #94a3b8;

    margin-top:
        6px;
}

.mine .message-time {

    color:
        #bfdbfe;
}

/* =========================================================
   REPLY
========================================================= */

.reply-preview {

    background:
        rgba(0,0,0,.18);

    border-left:
        3px solid #93c5fd;

    padding:
        7px 9px;

    border-radius:
        6px;

    margin-bottom:
        8px;

    font-size:
        12px;
}

.reply-name {

    font-weight:
        bold;

    margin-bottom:
        3px;
}

.reply-text {

    color:
        #cbd5e1;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

/* =========================================================
   ACTIONS
========================================================= */

.message-actions {

    display:
        flex;

    gap:
        6px;

    margin-top:
        8px;

    flex-wrap:
        wrap;
}

.message-actions button {

    border:
        0;

    border-radius:
        6px;

    padding:
        5px 8px;

    font-size:
        11px;

    color:
        white;

    background:
        rgba(255,255,255,.15);
}

.message-actions button:hover {

    background:
        rgba(255,255,255,.25);
}

/* =========================================================
   REACTIONS
========================================================= */

.reactions {

    display:
        flex;

    gap:
        5px;

    flex-wrap:
        wrap;

    margin-top:
        8px;
}

.reaction-button {

    border:
        1px solid rgba(255,255,255,.18);

    background:
        rgba(0,0,0,.15);

    color:
        white;

    border-radius:
        14px;

    padding:
        4px 8px;
}

.reaction-picker {

    display:
        flex;

    gap:
        4px;

    margin-top:
        7px;

    flex-wrap:
        wrap;
}

.reaction-picker button {

    border:
        0;

    background:
        #334155;

    color:
        white;

    border-radius:
        7px;

    padding:
        5px 7px;
}

/* =========================================================
   SYSTEM
========================================================= */

.system {

    text-align:
        center;

    color:
        #64748b;

    font-size:
        13px;

    margin:
        12px;
}

/* =========================================================
   SIDEBAR
========================================================= */

#onlinePanel {

    width:
        300px;

    flex-shrink:
        0;

    background:
        #111827;

    border-left:
        1px solid #334155;

    padding:
        18px;

    overflow-y:
        auto;
}

.online-title {

    font-size:
        15px;

    font-weight:
        bold;

    margin-bottom:
        5px;
}

.online-count {

    color:
        #94a3b8;

    font-size:
        12px;

    margin-bottom:
        15px;
}

/* =========================================================
   OWNER CONTROLS
========================================================= */

#ownerControls {

    display:
        none;

    margin-bottom:
        20px;

    padding-bottom:
        18px;

    border-bottom:
        1px solid #334155;
}

.owner-title {

    color:
        #facc15;

    font-weight:
        bold;

    margin-bottom:
        12px;
}

.owner-help {

    color:
        #94a3b8;

    font-size:
        11px;

    margin-bottom:
        12px;
}

.owner-button {

    width:
        100%;

    margin-bottom:
        8px;

    padding:
        9px;

    border:
        0;

    border-radius:
        8px;

    color:
        white;

    font-weight:
        bold;
}

.password-button {

    background:
        #7c3aed;
}

.rename-button {

    background:
        #2563eb;
}

.transfer-button {

    background:
        #0891b2;
}

.lock-button {

    background:
        #ca8a04;
}

.delete-button {

    background:
        #991b1b;
}

.owner-button:hover {

    filter:
        brightness(1.15);
}

.owner-user {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        8px;

    padding:
        8px 0;
}

.owner-user-name {

    min-width:
        0;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}

.kick-button {

    flex-shrink:
        0;

    border:
        0;

    background:
        #991b1b;

    color:
        white;

    padding:
        5px 8px;

    border-radius:
        6px;

    font-size:
        11px;
}

.kick-button:hover {

    background:
        #dc2626;
}

/* =========================================================
   ONLINE USERS
========================================================= */

.online-user {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        9px 5px;

    font-size:
        14px;
}

.online-dot {

    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        #4ade80;

    flex-shrink:
        0;
}

.owner-badge {

    display:
        inline-block;

    margin-left:
        5px;

    padding:
        2px 6px;

    border-radius:
        6px;

    background:
        #854d0e;

    color:
        #fef08a;

    font-size:
        10px;

    font-weight:
        bold;
}

.you-badge {

    color:
        #93c5fd;

    font-size:
        11px;
}

/* =========================================================
   TYPING
========================================================= */

#typingIndicator {

    min-height:
        22px;

    padding:
        0 20px;

    color:
        #94a3b8;

    font-size:
        12px;

    background:
        #1e293b;
}

/* =========================================================
   REPLY BAR
========================================================= */

#replyBar {

    display:
        none;

    background:
        #111827;

    border-top:
        1px solid #334155;

    padding:
        9px 15px;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;
}

.reply-bar-text {

    min-width:
        0;

    flex:
        1;
}

.reply-bar-title {

    font-size:
        12px;

    color:
        #60a5fa;

    font-weight:
        bold;
}

.reply-bar-message {

    color:
        #cbd5e1;

    font-size:
        12px;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

#cancelReply {

    border:
        0;

    background:
        #334155;

    color:
        white;

    border-radius:
        7px;

    padding:
        6px 10px;
}

/* =========================================================
   COMPOSER
========================================================= */

#composer {

    display:
        flex;

    gap:
        10px;

    padding:
        15px;

    background:
        #1e293b;

    border-top:
        1px solid #334155;
}

#sendButton {

    border:
        0;

    border-radius:
        10px;

    padding:
        13px 18px;

    background:
        #3b82f6;

    color:
        white;

    font-weight:
        bold;
}

#sendButton:disabled {

    opacity:
        .5;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #onlinePanel {
        display:
            none;
    }

    .message {
        max-width:
            88%;
    }

    #messages {
        padding:
            15px;
    }

    .chat-title {
        font-size:
            17px;
    }
}

</style>

</head>

<body>

<!-- =======================================================
     LOGIN
======================================================= -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬 LinkChat
        </div>

        <div class="subtitle">
            Create a room and share the link.
        </div>

        <label>Your name</label>

        <input
            id="username"
            maxlength="30"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <label>Room name</label>

        <input
            id="room"
            maxlength="100"
            placeholder="Example: Friends"
            autocomplete="off"
        >

        <label>Room password</label>

        <input
            id="password"
            type="password"
            maxlength="100"
            placeholder="Leave blank for no password"
            autocomplete="off"
        >

        <div class="password-help">
            For a new room, the first password becomes the room password.
        </div>

        <button id="joinButton">
            Join Chat
        </button>

    </div>

</div>


<!-- =======================================================
     CHAT
======================================================= -->

<div id="chat">

    <header>

        <div>

            <div class="chat-title">
                💬 <span id="roomTitle"></span>
            </div>

            <div
                id="status"
                class="status connecting"
            >
                🟡 Connecting...
            </div>

        </div>

        <button id="copyButton">
            🔗 Copy Link
        </button>

    </header>


    <div class="chat-area">

        <div id="messages"></div>


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <div id="onlinePanel">

            <!-- OWNER CONTROLS -->

            <div id="ownerControls">

                <div class="owner-title">
                    👑 Room Owner
                </div>

                <div class="owner-help">
                    You control this room.
                </div>

                <button
                    id="changePasswordButton"
                    class="owner-button password-button"
                >
                    🔒 Change Password
                </button>

                <button
                    id="renameRoomButton"
                    class="owner-button rename-button"
                >
                    ✏️ Rename Room
                </button>

                <button
                    id="transferOwnerButton"
                    class="owner-button transfer-button"
                >
                    👑 Transfer Ownership
                </button>

                <button
                    id="lockRoomButton"
                    class="owner-button lock-button"
                >
                    🔐 Lock Room
                </button>

                <button
                    id="deleteRoomButton"
                    class="owner-button delete-button"
                >
                    🗑️ Delete Room
                </button>

                <div
                    style="
                        margin-top:15px;
                        margin-bottom:8px;
                        font-size:12px;
                        color:#94a3b8;
                        font-weight:bold;
                    "
                >
                    Manage Members
                </div>

                <div id="ownerUsers"></div>

            </div>


            <div class="online-title">
                🟢 Online
            </div>

            <div
                id="onlineCount"
                class="online-count"
            >
                0 people online
            </div>

            <div id="onlineUsers"></div>

        </div>

    </div>


    <div id="typingIndicator"></div>


    <!-- REPLY -->

    <div id="replyBar">

        <div class="reply-bar-text">

            <div class="reply-bar-title">
                ↩️ Replying to
                <span id="replyBarName"></span>
            </div>

            <div
                id="replyBarMessage"
                class="reply-bar-message"
            ></div>

        </div>

        <button id="cancelReply">
            ✕
        </button>

    </div>


    <!-- COMPOSER -->

    <div id="composer">

        <input
            id="messageInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
        >

        <button
            id="sendButton"
            disabled
        >
            Send
        </button>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const login =
    document.getElementById("login");

const chat =
    document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const roomInput =
    document.getElementById("room");

const passwordInput =
    document.getElementById("password");

const joinButton =
    document.getElementById("joinButton");

const roomTitle =
    document.getElementById("roomTitle");

const statusElement =
    document.getElementById("status");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const copyButton =
    document.getElementById("copyButton");

const onlineUsers =
    document.getElementById("onlineUsers");

const onlineCount =
    document.getElementById("onlineCount");

const ownerControls =
    document.getElementById("ownerControls");

const ownerUsers =
    document.getElementById("ownerUsers");

const typingIndicator =
    document.getElementById("typingIndicator");

const replyBar =
    document.getElementById("replyBar");

const replyBarName =
    document.getElementById("replyBarName");

const replyBarMessage =
    document.getElementById("replyBarMessage");

const cancelReply =
    document.getElementById("cancelReply");

const changePasswordButton =
    document.getElementById(
        "changePasswordButton"
    );

const renameRoomButton =
    document.getElementById(
        "renameRoomButton"
    );

const transferOwnerButton =
    document.getElementById(
        "transferOwnerButton"
    );

const lockRoomButton =
    document.getElementById(
        "lockRoomButton"
    );

const deleteRoomButton =
    document.getElementById(
        "deleteRoomButton"
    );


/* =========================================================
   STATE
========================================================= */

let socket = null;

let username = "";

let room = "";

let password = "";

let ownerUsername = "";

let isOwner = false;

let roomLocked = false;

let onlineUserList = [];

let typingTimer = null;

let currentlyTyping =
    new Set();

let replyTo = null;


/* =========================================================
   URL ROOM
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlRoom =
    params.get("room");

if (urlRoom) {

    roomInput.value =
        urlRoom;
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    type,
    text
) {

    statusElement.className =
        "status " + type;

    statusElement.textContent =
        text;
}


/* =========================================================
   TIME
========================================================= */

function formatTime(time) {

    if (!time) {
        return "";
    }

    const date =
        new Date(time);

    const now =
        new Date();

    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return (
            "Today at " +
            date.toLocaleTimeString(
                [],
                {
                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            )
        );
    }

    return (
        date.toLocaleDateString(
            [],
            {
                month:
                    "short",

                day:
                    "numeric",

                year:
                    "numeric"
            }
        ) +
        " at " +
        date.toLocaleTimeString(
            [],
            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        )
    );
}


/* =========================================================
   MESSAGE
========================================================= */

function addMessage(
    name,
    message,
    mine,
    time,
    id,
    replyToId,
    reactions
) {

    const box =
        document.createElement("div");

    box.className =
        "message";

    if (mine) {

        box.classList.add(
            "mine"
        );
    }

    box.dataset.id =
        String(id);


    if (replyToId) {

        const replied =
            document.querySelector(
                `.message[data-id="${replyToId}"]`
            );

        if (replied) {

            const preview =
                document.createElement(
                    "div"
                );

            preview.className =
                "reply-preview";

            const repliedName =
                replied.querySelector(
                    ".name"
                );

            const repliedText =
                replied.querySelector(
                    ".message-text"
                );

            const nameElement =
                document.createElement(
                    "div"
                );

            nameElement.className =
                "reply-name";

            nameElement.textContent =
                repliedName.textContent;

            const textElement =
                document.createElement(
                    "div"
                );

            textElement.className =
                "reply-text";

            textElement.textContent =
                repliedText.textContent;

            preview.appendChild(
                nameElement
            );

            preview.appendChild(
                textElement
            );

            box.appendChild(
                preview
            );
        }
    }


    const nameElement =
        document.createElement(
            "div"
        );

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    if (
        name === ownerUsername
    ) {

        const badge =
            document.createElement(
                "span"
            );

        badge.className =
            "owner-badge";

        badge.textContent =
            "👑 OWNER";

        nameElement.appendChild(
            badge
        );
    }


    const messageElement =
        document.createElement(
            "div"
        );

    messageElement.className =
        "message-text";

    messageElement.textContent =
        message;


    const timeElement =
        document.createElement(
            "div"
        );

    timeElement.className =
        "message-time";

    timeElement.textContent =
        formatTime(time);


    box.appendChild(
        nameElement
    );

    box.appendChild(
        messageElement
    );

    box.appendChild(
        timeElement
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "message-actions";


    const replyButton =
        document.createElement(
            "button"
        );

    replyButton.textContent =
        "↩️ Reply";

    replyButton.onclick =
        () => startReply(
            id,
            name,
            message
        );

    actions.appendChild(
        replyButton
    );


    if (mine) {

        const editButton =
            document.createElement(
                "button"
            );

        editButton.textContent =
            "✏️ Edit";

        editButton.onclick =
            () => {

                const newMessage =
                    prompt(
                        "Edit your message:",
                        messageElement.textContent
                    );

                if (
                    newMessage ===
                    null
                ) {
                    return;
                }

                const trimmed =
                    newMessage.trim();

                if (!trimmed) {
                    return;
                }

                sendSocket({
                    type:
                        "edit",

                    id:
                        Number(id),

                    message:
                        trimmed
                });
            };


        const deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.textContent =
            "🗑️ Delete";

        deleteButton.onclick =
            () => {

                if (
                    !confirm(
                        "Delete this message?"
                    )
                ) {
                    return;
                }

                sendSocket({
                    type:
                        "delete",

                    id:
                        Number(id)
                });
            };


        actions.appendChild(
            editButton
        );

        actions.appendChild(
            deleteButton
        );
    }


    box.appendChild(
        actions
    );


    const reactionArea =
        document.createElement(
            "div"
        );

    reactionArea.className =
        "reactions";

    renderReactions(
        reactionArea,
        reactions || {},
        id
    );

    box.appendChild(
        reactionArea
    );


    const picker =
        document.createElement(
            "div"
        );

    picker.className =
        "reaction-picker";


    [
        "👍",
        "❤️",
        "😂",
        "😮",
        "😢",
        "😡"
    ].forEach(
        reaction => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                reaction;

            button.onclick =
                () =>
                    sendReaction(
                        id,
                        reaction
                    );

            picker.appendChild(
                button
            );
        }
    );


    box.appendChild(
        picker
    );

    messages.appendChild(
        box
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   REACTIONS
========================================================= */

function renderReactions(
    container,
    reactions,
    messageId
) {

    container.innerHTML =
        "";

    [
        "👍",
        "❤️",
        "😂",
        "😮",
        "😢",
        "😡"
    ].forEach(
        reaction => {

            const count =
                Number(
                    reactions[
                        reaction
                    ] || 0
                );

            if (count <= 0) {
                return;
            }

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "reaction-button";

            button.textContent =
                reaction +
                " " +
                count;

            button.onclick =
                () =>
                    sendReaction(
                        messageId,
                        reaction
                    );

            container.appendChild(
                button
            );
        }
    );
}


function sendReaction(
    messageId,
    reaction
) {

    sendSocket({
        type:
            "reaction",

        id:
            Number(messageId),

        reaction:
            reaction
    });
}


/* =========================================================
   SOCKET SEND
========================================================= */

function sendSocket(data) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return false;
    }

    socket.send(
        JSON.stringify(data)
    );

    return true;
}


/* =========================================================
   REPLY
========================================================= */

function startReply(
    id,
    name,
    message
) {

    replyTo =
        Number(id);

    replyBarName.textContent =
        name;

    replyBarMessage.textContent =
        message;

    replyBar.style.display =
        "flex";

    messageInput.focus();
}


function cancelReplyMode() {

    replyTo =
        null;

    replyBar.style.display =
        "none";

    replyBarName.textContent =
        "";

    replyBarMessage.textContent =
        "";
}


cancelReply.addEventListener(
    "click",
    cancelReplyMode
);


/* =========================================================
   SYSTEM MESSAGE
========================================================= */

function addSystemMessage(
    text
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(
        element
    );

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   OWNER CONTROLS
========================================================= */

function updateOwnerControls() {

    if (!isOwner) {

        ownerControls.style.display =
            "none";

        ownerUsers.innerHTML =
            "";

        return;
    }

    ownerControls.style.display =
        "block";


    lockRoomButton.textContent =
        roomLocked
            ? "🔓 Unlock Room"
            : "🔐 Lock Room";


    ownerUsers.innerHTML =
        "";


    onlineUserList.forEach(
        name => {

            if (
                name === username
            ) {
                return;
            }

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "owner-user";


            const nameElement =
                document.createElement(
                    "span"
                );

            nameElement.className =
                "owner-user-name";

            nameElement.textContent =
                name;


            const kickButton =
                document.createElement(
                    "button"
                );

            kickButton.className =
                "kick-button";

            kickButton.textContent =
                "👢 Kick";

            kickButton.onclick =
                () => {

                    if (
                        confirm(
                            `Kick ${name} from this room?`
                        )
                    ) {

                        sendSocket({
                            type:
                                "kick",

                            username:
                                name
                        });
                    }
                };


            row.appendChild(
                nameElement
            );

            row.appendChild(
                kickButton
            );

            ownerUsers.appendChild(
                row
            );
        }
    );


    if (
        onlineUserList.filter(
            name =>
                name !== username
        ).length === 0
    ) {

        const none =
            document.createElement(
                "div"
            );

        none.style.color =
            "#94a3b8";

        none.style.fontSize =
            "12px";

        none.textContent =
            "No other users are online.";

        ownerUsers.appendChild(
            none
        );
    }
}


/* =========================================================
   ONLINE USERS
========================================================= */

function updateOnlineUsers(
    users
) {

    onlineUserList =
        Array.isArray(users)
            ? users
            : [];


    onlineUsers.innerHTML =
        "";


    onlineCount.textContent =
        onlineUserList.length === 1
            ? "1 person online"
            : `${onlineUserList.length} people online`;


    onlineUserList.forEach(
        name => {

            const user =
                document.createElement(
                    "div"
                );

            user.className =
                "online-user";


            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "online-dot";


            const nameElement =
                document.createElement(
                    "span"
                );

            nameElement.textContent =
                name;


            if (
                name === ownerUsername
            ) {

                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "owner-badge";

                badge.textContent =
                    "👑 OWNER";

                nameElement.appendChild(
                    badge
                );
            }


            if (
                name === username
            ) {

                const you =
                    document.createElement(
                        "span"
                    );

                you.className =
                    "you-badge";

                you.textContent =
                    " (you)";

                nameElement.appendChild(
                    you
                );
            }


            user.appendChild(
                dot
            );

            user.appendChild(
                nameElement
            );

            onlineUsers.appendChild(
                user
            );
        }
    );


    updateOwnerControls();
}


/* =========================================================
   TYPING
========================================================= */

function updateTypingIndicator() {

    const names =
        Array.from(
            currentlyTyping
        );


    if (
        names.length === 0
    ) {

        typingIndicator.textContent =
            "";

        return;
    }


    if (
        names.length === 1
    ) {

        typingIndicator.textContent =
            `${names[0]} is typing...`;

        return;
    }


    if (
        names.length === 2
    ) {

        typingIndicator.textContent =
            `${names[0]} and ${names[1]} are typing...`;

        return;
    }


    typingIndicator.textContent =
        `${names.length} people are typing...`;
}


function sendTypingStatus(
    isTyping
) {

    sendSocket({
        type:
            "typing",

        typing:
            isTyping
    });
}


/* =========================================================
   COMPOSER
========================================================= */

function setComposerEnabled(
    enabled
) {

    messageInput.disabled =
        !enabled;

    sendButton.disabled =
        !enabled;
}


/* =========================================================
   CONNECT
========================================================= */

function connect() {

    setStatus(
        "connecting",
        "🟡 Connecting..."
    );


    const protocol =
        window.location.protocol ===
        "https:"
            ? "wss:"
            : "ws:";


    socket =
        new WebSocket(
            protocol +
            "//" +
            window.location.host
        );


    socket.addEventListener(
        "open",
        () => {

            setStatus(
                "connected",
                "🟢 Connected"
            );


            sendSocket({
                type:
                    "join",

                username:
                    username,

                room:
                    room,

                password:
                    password
            });
        }
    );


    socket.addEventListener(
        "message",
        event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            /* JOINED */

            if (
                data.type ===
                "joined"
            ) {

                roomTitle.textContent =
                    data.room;

                room =
                    data.room;

                ownerUsername =
                    data.owner || "";

                isOwner =
                    Boolean(
                        data.isOwner
                    );

                roomLocked =
                    Boolean(
                        data.locked
                    );


                updateOwnerControls();

                setComposerEnabled(
                    true
                );

                messageInput.focus();

                return;
            }


            /* OWNER */

            if (
                data.type ===
                "owner"
            ) {

                ownerUsername =
                    data.owner || "";

                isOwner =
                    username.toLowerCase() ===
                    ownerUsername.toLowerCase();


                updateOnlineUsers(
                    onlineUserList
                );

                return;
            }


            /* PASSWORD ERROR */

            if (
                data.type ===
                "passwordError"
            ) {

                alert(
                    "Incorrect room password."
                );

                if (socket) {
                    socket.close();
                }

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                setComposerEnabled(
                    false
                );

                passwordInput.focus();

                return;
            }


            /* LOCKED */

            if (
                data.type ===
                "roomLocked"
            ) {

                alert(
                    data.message ||
                    "This room is locked."
                );

                if (socket) {
                    socket.close();
                }

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                setComposerEnabled(
                    false
                );

                return;
            }


            /* KICKED */

            if (
                data.type ===
                "kicked"
            ) {

                alert(
                    data.message ||
                    "You were kicked from the room."
                );

                if (socket) {
                    socket.close();
                }

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                setComposerEnabled(
                    false
                );

                return;
            }


            /* ROOM RENAMED */

            if (
                data.type ===
                "roomRenamed"
            ) {

                room =
                    data.newName;

                roomTitle.textContent =
                    data.newName;

                history.replaceState(
                    {},
                    "",
                    "?room=" +
                    encodeURIComponent(
                        data.newName
                    )
                );

                return;
            }


            /* LOCK CHANGED */

            if (
                data.type ===
                "roomLockChanged"
            ) {

                roomLocked =
                    Boolean(
                        data.locked
                    );

                updateOwnerControls();

                return;
            }


            /* ROOM DELETED */

            if (
                data.type ===
                "roomDeleted"
            ) {

                alert(
                    data.message ||
                    "The room was deleted."
                );

                if (socket) {
                    socket.close();
                }

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                setComposerEnabled(
                    false
                );

                return;
            }


            /* PASSWORD CHANGED */

            if (
                data.type ===
                "passwordChanged"
            ) {

                alert(
                    data.message
                );

                return;
            }


            /* MESSAGE */

            if (
                data.type ===
                "message"
            ) {

                addMessage(
                    data.username,
                    data.message,
                    data.username ===
                        username,
                    data.time,
                    data.id,
                    data.replyTo,
                    data.reactions
                );

                return;
            }


            /* EDIT */

            if (
                data.type ===
                "messageEdited"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {

                    const text =
                        element.querySelector(
                            ".message-text"
                        );

                    if (text) {

                        text.textContent =
                            data.message +
                            " (edited)";
                    }
                }

                return;
            }


            /* DELETE */

            if (
                data.type ===
                "messageDeleted"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {
                    element.remove();
                }

                return;
            }


            /* REACTION */

            if (
                data.type ===
                "reactionUpdate"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {

                    const area =
                        element.querySelector(
                            ".reactions"
                        );

                    if (area) {

                        renderReactions(
                            area,
                            data.reactions ||
                                {},
                            data.id
                        );
                    }
                }

                return;
            }


            /* SYSTEM */

            if (
                data.type ===
                "system"
            ) {

                addSystemMessage(
                    data.message
                );

                return;
            }


            /* USERS */

            if (
                data.type ===
                "users"
            ) {

                updateOnlineUsers(
                    data.users || []
                );

                return;
            }


            /* TYPING */

            if (
                data.type ===
                "typing"
            ) {

                if (
                    data.typing
                ) {

                    currentlyTyping.add(
                        data.username
                    );

                } else {

                    currentlyTyping.delete(
                        data.username
                    );
                }

                updateTypingIndicator();

                return;
            }


            /* ERROR */

            if (
                data.type ===
                "error"
            ) {

                alert(
                    data.message ||
                    "Something went wrong."
                );
            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            setComposerEnabled(
                false
            );

            setStatus(
                "disconnected",
                "🔴 Disconnected"
            );
        }
    );
}


/* =========================================================
   JOIN
========================================================= */

function joinChat() {

    username =
        usernameInput.value.trim();

    room =
        roomInput.value.trim();

    password =
        passwordInput.value;


    if (!username) {

        alert(
            "Please enter your name."
        );

        usernameInput.focus();

        return;
    }


    if (!room) {

        alert(
            "Please enter a room name."
        );

        roomInput.focus();

        return;
    }


    history.replaceState(
        {},
        "",
        "?room=" +
        encodeURIComponent(
            room
        )
    );


    login.style.display =
        "none";

    chat.style.display =
        "flex";


    roomTitle.textContent =
        room;


    messages.innerHTML =
        "";

    onlineUsers.innerHTML =
        "";

    ownerUsers.innerHTML =
        "";

    onlineUserList =
        [];

    ownerUsername =
        "";

    isOwner =
        false;

    roomLocked =
        false;

    currentlyTyping.clear();

    cancelReplyMode();

    setComposerEnabled(
        false
    );

    updateOwnerControls();

    connect();
}


/* =========================================================
   SEND
========================================================= */

function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    if (
        !sendSocket({
            type:
                "message",

            message:
                message,

            replyTo:
                replyTo
        })
    ) {

        return;
    }


    sendTypingStatus(
        false
    );

    messageInput.value =
        "";

    cancelReplyMode();

    messageInput.focus();
}


/* =========================================================
   OWNER: CHANGE PASSWORD
========================================================= */

changePasswordButton.addEventListener(
    "click",
    () => {

        const newPassword =
            prompt(
                "Enter the new room password.\n\nLeave blank to remove the password."
            );

        if (
            newPassword ===
            null
        ) {
            return;
        }

        if (
            newPassword.length >
            100
        ) {

            alert(
                "Password is too long."
            );

            return;
        }

        sendSocket({
            type:
                "changePassword",

            password:
                newPassword
        });
    }
);


/* =========================================================
   OWNER: RENAME ROOM
========================================================= */

renameRoomButton.addEventListener(
    "click",
    () => {

        const newName =
            prompt(
                "Enter the new room name:",
                room
            );

        if (
            newName ===
            null
        ) {
            return;
        }

        const trimmed =
            newName.trim();

        if (!trimmed) {

            alert(
                "Room name cannot be empty."
            );

            return;
        }

        if (
            trimmed.length >
            100
        ) {

            alert(
                "Room name is too long."
            );

            return;
        }

        sendSocket({
            type:
                "renameRoom",

            newName:
                trimmed
        });
    }
);


/* =========================================================
   OWNER: TRANSFER
========================================================= */

transferOwnerButton.addEventListener(
    "click",
    () => {

        const others =
            onlineUserList.filter(
                name =>
                    name !== username
            );

        if (
            others.length ===
            0
        ) {

            alert(
                "There are no other online users to transfer ownership to."
            );

            return;
        }

        const target =
            prompt(
                "Enter the exact username of the new owner:\n\n" +
                others.join("\n")
            );

        if (
            target ===
            null
        ) {
            return;
        }

        const trimmed =
            target.trim();

        if (!trimmed) {
            return;
        }

        if (
            !others.includes(
                trimmed
            )
        ) {

            alert(
                "That user is not online."
            );

            return;
        }

        if (
            !confirm(
                `Transfer ownership to ${trimmed}?`
            )
        ) {

            return;
        }

        sendSocket({
            type:
                "transferOwner",

            username:
                trimmed
        });
    }
);


/* =========================================================
   OWNER: LOCK
========================================================= */

lockRoomButton.addEventListener(
    "click",
    () => {

        const action =
            roomLocked
                ? "unlock"
                : "lock";

        if (
            !confirm(
                roomLocked
                    ? "Unlock this room so new users can join?"
                    : "Lock this room? Current users will stay connected, but new users will not be able to join."
            )
        ) {

            return;
        }

        sendSocket({
            type:
                "toggleLock"
        });
    }
);


/* =========================================================
   OWNER: DELETE
========================================================= */

deleteRoomButton.addEventListener(
    "click",
    () => {

        const confirmation =
            prompt(
                `This permanently deletes the room, its messages, and reactions.\n\nType DELETE to confirm:`
            );

        if (
            confirmation !==
            "DELETE"
        ) {

            return;
        }

        sendSocket({
            type:
                "deleteRoom"
        });
    }
);


/* =========================================================
   BUTTONS
========================================================= */

joinButton.addEventListener(
    "click",
    joinChat
);

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER TO JOIN
========================================================= */

usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinChat();
        }
    }
);

roomInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinChat();
        }
    }
);

passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinChat();
        }
    }
);


/* =========================================================
   TYPING
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        sendTypingStatus(
            true
        );

        clearTimeout(
            typingTimer
        );

        typingTimer =
            setTimeout(
                () => {

                    sendTypingStatus(
                        false
                    );

                },
                1200
            );
    }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   COPY LINK
========================================================= */

copyButton.addEventListener(
    "click",
    async () => {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );

            copyButton.textContent =
                "✓ Copied!";


            setTimeout(
                () => {

                    copyButton.textContent =
                        "🔗 Copy Link";

                },
                1500
            );

        } catch {

            alert(
                "Copy failed. Copy the URL manually."
            );
        }
    }
);

</script>
