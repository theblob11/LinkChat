<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LinkChat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* LOGIN */

#login {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: #1e293b;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

#joinButton {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
}

#joinButton:hover {
    background: #2563eb;
}


/* PASSWORD */

#passwordGroup {
    display: block;
}

.password-help {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 5px;
}


/* CHAT */

#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}


/* HEADER */

header {
    height: 75px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
}

.chat-title {
    font-size: 20px;
    font-weight: bold;
}

.status {
    font-size: 13px;
    margin-top: 3px;
}

.connected {
    color: #4ade80;
}

.disconnected {
    color: #f87171;
}

.connecting {
    color: #facc15;
}

#copyButton {
    background: #334155;
    color: white;
    border: 0;
    padding: 10px 14px;
    border-radius: 9px;
}

#copyButton:hover {
    background: #475569;
}


/* MESSAGES */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 75%;
    background: #1e293b;
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 12px;
}

.message.mine {
    background: #2563eb;
    margin-left: auto;
}

.name {
    font-size: 12px;
    color: #93c5fd;
    margin-bottom: 4px;
    font-weight: bold;
}

.mine .name {
    color: #dbeafe;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message-time {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 5px;
}

.mine .message-time {
    color: #bfdbfe;
}


/* EDIT / DELETE */

.message-actions {
    display: flex;
    gap: 6px;
    margin-top: 7px;
}

.message-actions button {
    border: 0;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    background: rgba(255,255,255,.15);
    color: white;
}

.message-actions button:hover {
    background: rgba(255,255,255,.25);
}

.edited-label {
    font-size: 10px;
    color: #bfdbfe;
    margin-left: 6px;
}


/* SYSTEM */

.system {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 12px;
}


/* COMPOSER */

#composer {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#messageInput {
    flex: 1;
}

#sendButton {
    background: #3b82f6;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    font-weight: bold;
}

#sendButton:disabled {
    opacity: .5;
}


/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 0 12px;
    }

    .chat-title {
        font-size: 17px;
    }

    #messages {
        padding: 15px;
    }

    .message {
        max-width: 88%;
    }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬 LinkChat
        </div>

        <div class="subtitle">
            Create a room and share the link.
        </div>


        <label>
            Your name
        </label>

        <input
            id="username"
            maxlength="30"
            placeholder="Enter your name"
            autocomplete="off"
        >


        <label>
            Room name
        </label>

        <input
            id="room"
            maxlength="100"
            placeholder="Example: Friends"
            autocomplete="off"
        >


        <label>
            Room password
        </label>

        <input
            id="password"
            type="password"
            maxlength="100"
            placeholder="Leave blank for no password"
            autocomplete="off"
        >

        <div class="password-help">
            The first password used for a new room becomes its password.
        </div>


        <button id="joinButton">
            Join Chat
        </button>

    </div>

</div>



<!-- CHAT -->

<div id="chat">

    <header>

        <div>

            <div class="chat-title">
                💬 <span id="roomTitle"></span>
            </div>

            <div id="status" class="status connecting">
                🟡 Connecting...
            </div>

            <div class="status">
                👥 <span id="userCount">0</span> online
            </div>

        </div>


        <button id="copyButton">
            🔗 Copy Link
        </button>

    </header>


    <div id="messages"></div>


    <div id="composer">

        <input
            id="messageInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
        >

        <button id="sendButton" disabled>
            Send
        </button>

    </div>

</div>



<script>


const login =
    document.getElementById("login");

const chat =
    document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const roomInput =
    document.getElementById("room");

const passwordInput =
    document.getElementById("password");

const joinButton =
    document.getElementById("joinButton");

const roomTitle =
    document.getElementById("roomTitle");

const statusElement =
    document.getElementById("status");

const userCount =
    document.getElementById("userCount");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const copyButton =
    document.getElementById("copyButton");


let socket = null;

let username = "";

let room = "";

let password = "";

let reconnectTimer = null;

let manuallyDisconnected = false;

let roomChecked = false;



/* ROOM FROM URL */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const urlRoom =
    urlParams.get("room");

if (urlRoom) {
    roomInput.value = urlRoom;
}



/* STATUS */

function setStatus(type, text) {

    statusElement.className =
        "status " + type;

    statusElement.textContent =
        text;

}



/* TIME */

function formatTime(time) {

    if (!time) {
        return "";
    }

    const date =
        new Date(time);

    const now =
        new Date();

    const isToday =
        date.toDateString() ===
        now.toDateString();

    const yesterday =
        new Date(now);

    yesterday.setDate(
        now.getDate() - 1
    );

    const isYesterday =
        date.toDateString() ===
        yesterday.toDateString();

    const timeString =
        date.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        });

    if (isToday) {
        return "Today at " + timeString;
    }

    if (isYesterday) {
        return "Yesterday at " + timeString;
    }

    return date.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
    }) +
    " at " +
    timeString;

}



/* ADD MESSAGE */

function addMessage(
    name,
    message,
    mine,
    time,
    id
) {

    const box =
        document.createElement("div");

    box.className =
        "message";

    if (mine) {
        box.classList.add("mine");
    }

    box.dataset.id =
        String(id);


    const nameElement =
        document.createElement("div");

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    const messageElement =
        document.createElement("div");

    messageElement.className =
        "message-text";

    messageElement.textContent =
        message;


    const timeElement =
        document.createElement("div");

    timeElement.className =
        "message-time";

    timeElement.textContent =
        formatTime(time);


    box.appendChild(nameElement);

    box.appendChild(messageElement);

    box.appendChild(timeElement);



    /* OWN MESSAGE BUTTONS */

    if (mine) {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        /* EDIT */

        const editButton =
            document.createElement("button");

        editButton.textContent =
            "✏️ Edit";


        editButton.onclick =
            function() {

                const newMessage =
                    prompt(
                        "Edit your message:",
                        messageElement.textContent
                    );

                if (
                    newMessage === null
                ) {
                    return;
                }

                const trimmed =
                    newMessage.trim();

                if (!trimmed) {
                    return;
                }

                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "edit",
                            id: Number(id),
                            message: trimmed
                        })
                    );

                }

            };


        /* DELETE */

        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "🗑️ Delete";


        deleteButton.onclick =
            function() {

                if (
                    !confirm(
                        "Delete this message?"
                    )
                ) {
                    return;
                }

                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "delete",
                            id: Number(id)
                        })
                    );

                }

            };


        actions.appendChild(
            editButton
        );

        actions.appendChild(
            deleteButton
        );

        box.appendChild(
            actions
        );

    }


    messages.appendChild(box);

    messages.scrollTop =
        messages.scrollHeight;

}



/* SYSTEM MESSAGE */

function addSystemMessage(text) {

    const element =
        document.createElement("div");

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;

}



/* COMPOSER */

function setComposerEnabled(enabled) {

    messageInput.disabled =
        !enabled;

    sendButton.disabled =
        !enabled;

}



/* CONNECT */

function connect() {

    clearTimeout(
        reconnectTimer
    );

    setStatus(
        "connecting",
        "🟡 Connecting..."
    );


    const protocol =
        window.location.protocol ===
        "https:"
            ? "wss:"
            : "ws:";


    socket =
        new WebSocket(
            protocol +
            "//" +
            window.location.host
        );


    socket.addEventListener(
        "open",
        function() {

            setStatus(
                "connected",
                "🟢 Connected"
            );


            socket.send(
                JSON.stringify({
                    type: "join",
                    username: username,
                    room: room,
                    password: password
                })
            );

        }
    );


    socket.addEventListener(
        "message",
        function(event) {

            let data;


            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            /* JOINED */

            if (
                data.type ===
                "joined"
            ) {

                roomTitle.textContent =
                    data.room;

                setComposerEnabled(
                    true
                );

                messageInput.focus();

                return;

            }


            /* PASSWORD ERROR */

            if (
                data.type ===
                "passwordError"
            ) {

                setComposerEnabled(
                    false
                );

                alert(
                    "Incorrect room password."
                );

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                passwordInput.focus();

                if (socket) {
                    socket.close();
                }

                return;

            }


            /* MESSAGE */

            if (
                data.type ===
                "message"
            ) {

                addMessage(
                    data.username,
                    data.message,
                    data.username === username,
                    data.time,
                    data.id
                );

                return;

            }


            /* EDIT */

            if (
                data.type ===
                "messageEdited"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {

                    const text =
                        element.querySelector(
                            ".message-text"
                        );

                    if (text) {

                        text.textContent =
                            data.message;

                        const label =
                            document.createElement(
                                "span"
                            );

                        label.className =
                            "edited-label";

                        label.textContent =
                            " (edited)";

                        text.appendChild(
                            label
                        );

                    }

                }

                return;

            }


            /* DELETE */

            if (
                data.type ===
                "messageDeleted"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {
                    element.remove();
                }

                return;

            }


            /* SYSTEM */

            if (
                data.type ===
                "system"
            ) {

                addSystemMessage(
                    data.message
                );

                return;

            }


            /* USERS */

            if (
                data.type ===
                "users"
            ) {

                userCount.textContent =
                    data.count;

                return;

            }


            /* ERROR */

            if (
                data.type ===
                "error"
            ) {

                addSystemMessage(
                    data.message
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        function() {

            setComposerEnabled(
                false
            );

            if (
                !manuallyDisconnected
            ) {

                setStatus(
                    "disconnected",
                    "🔴 Disconnected"
                );

            }

        }
    );

}



/* JOIN */

function joinChat() {

    username =
        usernameInput.value.trim();

    room =
        roomInput.value.trim();

    password =
        passwordInput.value;


    if (!username) {

        alert(
            "Please enter your name."
        );

        usernameInput.focus();

        return;

    }


    if (!room) {

        alert(
            "Please enter a room name."
        );

        roomInput.focus();

        return;

    }


    if (room.length < 1) {
        return;
    }


    history.replaceState(
        {},
        "",
        "?room=" +
        encodeURIComponent(room)
    );


    login.style.display =
        "none";

    chat.style.display =
        "flex";

    roomTitle.textContent =
        room;

    messages.innerHTML =
        "";

    manuallyDisconnected =
        false;

    connect();

}



/* SEND */

function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        addSystemMessage(
            "You are not connected."
        );

        return;

    }

    socket.send(
        JSON.stringify({
            type: "message",
            message: message
        })
    );

    messageInput.value =
        "";

    messageInput.focus();

}



/* EVENTS */

joinButton.addEventListener(
    "click",
    joinChat
);


sendButton.addEventListener(
    "click",
    sendMessage
);


usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {
            joinChat();
        }

    }
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {
            joinChat();
        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {
            joinChat();
        }

    }
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


copyButton.addEventListener(
    "click",
    async function() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );

            copyButton.textContent =
                "✓ Copied!";

            setTimeout(
                function() {

                    copyButton.textContent =
                        "🔗 Copy Link";

                },
                1500
            );

        } catch {

            alert(
                "Copy failed. Copy the URL manually."
            );

        }

    }
);

</script>

</body>
</html>
