<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LinkChat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
}

/* LOGIN */

#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: #1e293b;
    padding: 35px;
    border-radius: 18px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitle {
    color: #94a3b8;
    margin: 8px 0 25px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

.password-help {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 6px;
}

#joinButton {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#joinButton:hover {
    background: #2563eb;
}

/* CHAT */

#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}

/* HEADER */

header {
    height: 72px;
    flex-shrink: 0;
    background: #1e293b;
    border-bottom: 1px solid #334155;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 18px;
}

.chat-title {
    font-size: 20px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    margin-top: 4px;
}

.connected {
    color: #4ade80;
}

.disconnected {
    color: #f87171;
}

.connecting {
    color: #facc15;
}

#copyButton {
    border: none;
    background: #334155;
    color: white;
    padding: 10px 14px;
    border-radius: 9px;
    cursor: pointer;
}

#copyButton:hover {
    background: #475569;
}

/* CHAT AREA */

.chat-area {
    flex: 1;
    display: flex;
    min-height: 0;
}

/* MESSAGES */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 75%;
    background: #1e293b;
    padding: 11px 14px;
    border-radius: 14px;
    margin-bottom: 15px;
    position: relative;
}

.message.mine {
    margin-left: auto;
    background: #2563eb;
}

.name {
    font-size: 12px;
    color: #93c5fd;
    font-weight: bold;
    margin-bottom: 5px;
}

.mine .name {
    color: #dbeafe;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message-time {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 6px;
}

.mine .message-time {
    color: #bfdbfe;
}

/* REPLY PREVIEW */

.reply-preview {
    background: rgba(0, 0, 0, 0.18);
    border-left: 3px solid #93c5fd;
    padding: 7px 9px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 12px;
}

.reply-name {
    font-weight: bold;
    margin-bottom: 3px;
}

.reply-text {
    color: #cbd5e1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ACTIONS */

.message-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.message-actions button {
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: white;
    background: rgba(255, 255, 255, .15);
    cursor: pointer;
}

.message-actions button:hover {
    background: rgba(255, 255, 255, .25);
}

.edited-label {
    font-size: 10px;
    margin-left: 5px;
    opacity: .8;
}

/* REACTIONS */

.reactions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 8px;
}

.reaction-button {
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.15);
    color: white;
    border-radius: 14px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 13px;
}

.reaction-button:hover {
    background: rgba(255,255,255,.15);
}

.reaction-count {
    font-size: 11px;
    margin-left: 2px;
}

/* REACTION PICKER */

.reaction-picker {
    display: flex;
    gap: 4px;
    margin-top: 7px;
    flex-wrap: wrap;
}

.reaction-picker button {
    border: none;
    background: #334155;
    color: white;
    border-radius: 7px;
    padding: 5px 7px;
    cursor: pointer;
    font-size: 16px;
}

.reaction-picker button:hover {
    background: #475569;
}

/* SYSTEM */

.system {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 12px;
}

/* ONLINE */

#onlinePanel {
    width: 230px;
    flex-shrink: 0;

    background: #111827;
    border-left: 1px solid #334155;

    padding: 18px;

    overflow-y: auto;
}

.online-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

.online-count {
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 15px;
}

.online-user {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 5px;

    font-size: 14px;
}

.online-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4ade80;
    flex-shrink: 0;
}

/* TYPING */

#typingIndicator {
    min-height: 22px;
    padding: 0 20px;

    color: #94a3b8;

    font-size: 12px;

    background: #1e293b;
}

/* REPLY BAR */

#replyBar {
    display: none;
    background: #111827;
    border-top: 1px solid #334155;
    padding: 9px 15px;

    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.reply-bar-text {
    min-width: 0;
    flex: 1;
}

.reply-bar-title {
    font-size: 12px;
    color: #60a5fa;
    font-weight: bold;
}

.reply-bar-message {
    color: #cbd5e1;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#cancelReply {
    border: none;
    background: #334155;
    color: white;
    border-radius: 7px;
    padding: 6px 10px;
    cursor: pointer;
}

/* COMPOSER */

#composer {
    display: flex;
    gap: 10px;

    padding: 15px;

    background: #1e293b;
    border-top: 1px solid #334155;
}

#messageInput {
    flex: 1;
}

#sendButton {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;

    background: #3b82f6;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

#sendButton:disabled {
    opacity: .5;
}

/* MOBILE */

@media (max-width: 700px) {

    #onlinePanel {
        display: none;
    }

    .message {
        max-width: 88%;
    }

    #messages {
        padding: 15px;
    }

    header {
        padding: 0 12px;
    }

    .chat-title {
        font-size: 17px;
    }
}
</style>

</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬 LinkChat
        </div>

        <div class="subtitle">
            Create a room and share the link.
        </div>

        <label>Your name</label>

        <input
            id="username"
            maxlength="30"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <label>Room name</label>

        <input
            id="room"
            maxlength="100"
            placeholder="Example: Friends"
            autocomplete="off"
        >

        <label>Room password</label>

        <input
            id="password"
            type="password"
            maxlength="100"
            placeholder="Leave blank for no password"
            autocomplete="off"
        >

        <div class="password-help">
            For a new room, the first password becomes the room password.
        </div>

        <button id="joinButton">
            Join Chat
        </button>

    </div>

</div>


<!-- CHAT -->

<div id="chat">

    <header>

        <div>

            <div class="chat-title">
                💬 <span id="roomTitle"></span>
            </div>

            <div
                id="status"
                class="status connecting"
            >
                🟡 Connecting...
            </div>

        </div>

        <button id="copyButton">
            🔗 Copy Link
        </button>

    </header>


    <div class="chat-area">

        <div id="messages"></div>


        <div id="onlinePanel">

            <div class="online-title">
                🟢 Online
            </div>

            <div
                class="online-count"
                id="onlineCount"
            >
                0 people online
            </div>

            <div id="onlineUsers"></div>

        </div>

    </div>


    <div id="typingIndicator"></div>


    <!-- REPLY BAR -->

    <div id="replyBar">

        <div class="reply-bar-text">

            <div class="reply-bar-title">
                ↩️ Replying to <span id="replyBarName"></span>
            </div>

            <div
                class="reply-bar-message"
                id="replyBarMessage"
            ></div>

        </div>

        <button id="cancelReply">
            ✕
        </button>

    </div>


    <!-- COMPOSER -->

    <div id="composer">

        <input
            id="messageInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
        >

        <button
            id="sendButton"
            disabled
        >
            Send
        </button>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const login =
    document.getElementById("login");

const chat =
    document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const roomInput =
    document.getElementById("room");

const passwordInput =
    document.getElementById("password");

const joinButton =
    document.getElementById("joinButton");

const roomTitle =
    document.getElementById("roomTitle");

const statusElement =
    document.getElementById("status");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const copyButton =
    document.getElementById("copyButton");

const onlineUsers =
    document.getElementById("onlineUsers");

const onlineCount =
    document.getElementById("onlineCount");

const typingIndicator =
    document.getElementById("typingIndicator");

const replyBar =
    document.getElementById("replyBar");

const replyBarName =
    document.getElementById("replyBarName");

const replyBarMessage =
    document.getElementById("replyBarMessage");

const cancelReply =
    document.getElementById("cancelReply");


/* =========================
   VARIABLES
========================= */

let socket = null;

let username = "";

let room = "";

let password = "";

let typingTimer = null;

let currentlyTyping = new Set();

let replyTo = null;


/* =========================
   URL ROOM
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlRoom =
    params.get("room");

if (urlRoom) {
    roomInput.value = urlRoom;
}


/* =========================
   STATUS
========================= */

function setStatus(type, text) {

    statusElement.className =
        "status " + type;

    statusElement.textContent =
        text;
}


/* =========================
   TIME
========================= */

function formatTime(time) {

    if (!time) {
        return "";
    }

    const date =
        new Date(time);

    const now =
        new Date();

    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return (
            "Today at " +
            date.toLocaleTimeString(
                [],
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            )
        );

    }

    return (
        date.toLocaleDateString(
            [],
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        ) +
        " at " +
        date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        )
    );
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    name,
    message,
    mine,
    time,
    id,
    replyToId,
    reactions
) {

    const box =
        document.createElement("div");

    box.className =
        "message";

    if (mine) {
        box.classList.add("mine");
    }

    box.dataset.id =
        String(id);


    /* =========================
       REPLY PREVIEW
    ========================= */

    if (replyToId) {

        const repliedMessage =
            document.querySelector(
                `.message[data-id="${replyToId}"]`
            );


        if (repliedMessage) {

            const repliedName =
                repliedMessage
                    .querySelector(".name")
                    .textContent;

            const repliedText =
                repliedMessage
                    .querySelector(".message-text")
                    .textContent;


            const preview =
                document.createElement("div");

            preview.className =
                "reply-preview";


            const previewName =
                document.createElement("div");

            previewName.className =
                "reply-name";

            previewName.textContent =
                repliedName;


            const previewText =
                document.createElement("div");

            previewText.className =
                "reply-text";

            previewText.textContent =
                repliedText;


            preview.appendChild(
                previewName
            );

            preview.appendChild(
                previewText
            );

            box.appendChild(preview);
        }
    }


    /* =========================
       NAME
    ========================= */

    const nameElement =
        document.createElement("div");

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    /* =========================
       MESSAGE TEXT
    ========================= */

    const messageElement =
        document.createElement("div");

    messageElement.className =
        "message-text";

    messageElement.textContent =
        message;


    /* =========================
       TIME
    ========================= */

    const timeElement =
        document.createElement("div");

    timeElement.className =
        "message-time";

    timeElement.textContent =
        formatTime(time);


    box.appendChild(nameElement);

    box.appendChild(messageElement);

    box.appendChild(timeElement);


    /* =========================
       ACTIONS
    ========================= */

    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    /* REPLY BUTTON */

    const replyButton =
        document.createElement("button");

    replyButton.textContent =
        "↩️ Reply";


    replyButton.onclick =
        function() {

            startReply(
                id,
                name,
                message
            );

        };


    actions.appendChild(
        replyButton
    );


    /* EDIT / DELETE */

    if (mine) {

        const editButton =
            document.createElement("button");

        editButton.textContent =
            "✏️ Edit";


        editButton.onclick =
            function() {

                const newMessage =
                    prompt(
                        "Edit your message:",
                        messageElement.textContent
                    );


                if (
                    newMessage === null
                ) {
                    return;
                }


                const trimmed =
                    newMessage.trim();


                if (!trimmed) {
                    return;
                }


                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "edit",
                            id: Number(id),
                            message: trimmed
                        })
                    );

                }

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "🗑️ Delete";


        deleteButton.onclick =
            function() {

                if (
                    !confirm(
                        "Delete this message?"
                    )
                ) {
                    return;
                }


                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "delete",
                            id: Number(id)
                        })
                    );

                }

            };


        actions.appendChild(
            editButton
        );

        actions.appendChild(
            deleteButton
        );

    }


    box.appendChild(actions);


    /* =========================
       REACTIONS
    ========================= */

    const reactionArea =
        document.createElement("div");

    reactionArea.className =
        "reactions";


    renderReactions(
        reactionArea,
        reactions || {},
        id
    );


    box.appendChild(
        reactionArea
    );


    /* =========================
       REACTION PICKER
    ========================= */

    const picker =
        document.createElement("div");

    picker.className =
        "reaction-picker";


    const reactionList = [
        "👍",
        "❤️",
        "😂",
        "😮",
        "😢",
        "😡"
    ];


    reactionList.forEach(
        function(reaction) {

            const button =
                document.createElement("button");

            button.textContent =
                reaction;


            button.onclick =
                function() {

                    sendReaction(
                        id,
                        reaction
                    );

                };


            picker.appendChild(
                button
            );

        }
    );


    box.appendChild(
        picker
    );


    messages.appendChild(box);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   RENDER REACTIONS
========================= */

function renderReactions(
    container,
    reactions,
    messageId
) {

    container.innerHTML = "";


    const reactionList = [
        "👍",
        "❤️",
        "😂",
        "😮",
        "😢",
        "😡"
    ];


    reactionList.forEach(
        function(reaction) {

            const count =
                Number(
                    reactions[reaction] || 0
                );


            if (count <= 0) {
                return;
            }


            const button =
                document.createElement("button");

            button.className =
                "reaction-button";

            button.textContent =
                reaction;


            const countElement =
                document.createElement("span");

            countElement.className =
                "reaction-count";

            countElement.textContent =
                count;


            button.appendChild(
                countElement
            );


            button.onclick =
                function() {

                    sendReaction(
                        messageId,
                        reaction
                    );

                };


            container.appendChild(
                button
            );

        }
    );
}


/* =========================
   SEND REACTION
========================= */

function sendReaction(
    messageId,
    reaction
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }


    socket.send(
        JSON.stringify({
            type: "reaction",
            id: Number(messageId),
            reaction: reaction
        })
    );
}


/* =========================
   START REPLY
========================= */

function startReply(
    id,
    name,
    message
) {

    replyTo =
        Number(id);


    replyBarName.textContent =
        name;


    replyBarMessage.textContent =
        message;


    replyBar.style.display =
        "flex";


    messageInput.focus();
}


/* =========================
   CANCEL REPLY
========================= */

function cancelReplyMode() {

    replyTo = null;

    replyBar.style.display =
        "none";

    replyBarName.textContent =
        "";

    replyBarMessage.textContent =
        "";
}


cancelReply.addEventListener(
    "click",
    cancelReplyMode
);


/* =========================
   SYSTEM MESSAGE
========================= */

function addSystemMessage(text) {

    const element =
        document.createElement("div");

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================
   ONLINE USERS
========================= */

function updateOnlineUsers(users) {

    onlineUsers.innerHTML = "";


    onlineCount.textContent =
        users.length === 1
            ? "1 person online"
            : `${users.length} people online`;


    users.forEach(
        function(name) {

            const user =
                document.createElement("div");

            user.className =
                "online-user";


            const dot =
                document.createElement("div");

            dot.className =
                "online-dot";


            const nameElement =
                document.createElement("span");

            nameElement.textContent =
                name === username
                    ? name + " (you)"
                    : name;


            user.appendChild(dot);

            user.appendChild(
                nameElement
            );

            onlineUsers.appendChild(user);

        }
    );
}


/* =========================
   TYPING
========================= */

function updateTypingIndicator() {

    const names =
        Array.from(
            currentlyTyping
        );


    if (names.length === 0) {

        typingIndicator.textContent =
            "";

        return;
    }


    if (names.length === 1) {

        typingIndicator.textContent =
            `${names[0]} is typing...`;

        return;
    }


    if (names.length === 2) {

        typingIndicator.textContent =
            `${names[0]} and ${names[1]} are typing...`;

        return;
    }


    typingIndicator.textContent =
        `${names.length} people are typing...`;
}


function sendTypingStatus(
    isTyping
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }


    socket.send(
        JSON.stringify({
            type: "typing",
            typing: isTyping
        })
    );
}


/* =========================
   COMPOSER
========================= */

function setComposerEnabled(
    enabled
) {

    messageInput.disabled =
        !enabled;

    sendButton.disabled =
        !enabled;
}


/* =========================
   CONNECT
========================= */

function connect() {

    setStatus(
        "connecting",
        "🟡 Connecting..."
    );


    const protocol =
        window.location.protocol ===
        "https:"
            ? "wss:"
            : "ws:";


    socket =
        new WebSocket(
            protocol +
            "//" +
            window.location.host
        );


    socket.addEventListener(
        "open",
        function() {

            setStatus(
                "connected",
                "🟢 Connected"
            );


            socket.send(
                JSON.stringify({
                    type: "join",
                    username: username,
                    room: room,
                    password: password
                })
            );
        }
    );


    socket.addEventListener(
        "message",
        function(event) {

            let data;


            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            /* JOINED */

            if (
                data.type === "joined"
            ) {

                roomTitle.textContent =
                    data.room;

                setComposerEnabled(true);

                messageInput.focus();

                return;
            }


            /* PASSWORD ERROR */

            if (
                data.type ===
                "passwordError"
            ) {

                alert(
                    "Incorrect room password."
                );


                setComposerEnabled(false);

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                passwordInput.focus();


                if (socket) {
                    socket.close();
                }


                return;
            }


            /* MESSAGE */

            if (
                data.type === "message"
            ) {

                addMessage(
                    data.username,
                    data.message,
                    data.username === username,
                    data.time,
                    data.id,
                    data.replyTo,
                    data.reactions
                );


                return;
            }


            /* MESSAGE EDITED */

            if (
                data.type ===
                "messageEdited"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );


                if (element) {

                    const text =
                        element.querySelector(
                            ".message-text"
                        );


                    if (text) {

                        text.textContent =
                            data.message;


                        const label =
                            document.createElement(
                                "span"
                            );


                        label.className =
                            "edited-label";


                        label.textContent =
                            "(edited)";


                        text.appendChild(
                            label
                        );

                    }
                }


                return;
            }


            /* MESSAGE DELETED */

            if (
                data.type ===
                "messageDeleted"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );


                if (element) {
                    element.remove();
                }


                return;
            }


            /* REACTION UPDATE */

            if (
                data.type ===
                "reactionUpdate"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );


                if (element) {

                    const reactionArea =
                        element.querySelector(
                            ".reactions"
                        );


                    if (reactionArea) {

                        renderReactions(
                            reactionArea,
                            data.reactions || {},
                            data.id
                        );

                    }

                }


                return;
            }


            /* SYSTEM */

            if (
                data.type === "system"
            ) {

                addSystemMessage(
                    data.message
                );


                return;
            }


            /* ONLINE */

            if (
                data.type === "users"
            ) {

                updateOnlineUsers(
                    data.users || []
                );


                return;
            }


            /* TYPING */

            if (
                data.type === "typing"
            ) {

                if (data.typing) {

                    currentlyTyping.add(
                        data.username
                    );

                } else {

                    currentlyTyping.delete(
                        data.username
                    );

                }


                updateTypingIndicator();


                return;
            }


            /* ERROR */

            if (
                data.type === "error"
            ) {

                addSystemMessage(
                    data.message
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        function() {

            setComposerEnabled(false);


            setStatus(
                "disconnected",
                "🔴 Disconnected"
            );

        }
    );
}


/* =========================
   JOIN
========================= */

function joinChat() {

    username =
        usernameInput.value.trim();

    room =
        roomInput.value.trim();

    password =
        passwordInput.value;


    if (!username) {

        alert(
            "Please enter your name."
        );

        usernameInput.focus();

        return;
    }


    if (!room) {

        alert(
            "Please enter a room name."
        );

        roomInput.focus();

        return;
    }


    history.replaceState(
        {},
        "",
        "?room=" +
        encodeURIComponent(room)
    );


    login.style.display =
        "none";


    chat.style.display =
        "flex";


    roomTitle.textContent =
        room;


    messages.innerHTML =
        "";

    onlineUsers.innerHTML =
        "";

    onlineCount.textContent =
        "0 people online";

    typingIndicator.textContent =
        "";


    currentlyTyping.clear();


    cancelReplyMode();


    setComposerEnabled(false);


    connect();
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }


    sendTypingStatus(false);


    socket.send(
        JSON.stringify({
            type: "message",
            message: message,
            replyTo: replyTo
        })
    );


    messageInput.value =
        "";


    cancelReplyMode();


    messageInput.focus();
}


/* =========================
   BUTTONS
========================= */

joinButton.addEventListener(
    "click",
    joinChat
);


sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER TO JOIN
========================= */

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }
    }
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }
    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }
    }
);


/* =========================
   TYPING
========================= */

messageInput.addEventListener(
    "input",
    function() {

        sendTypingStatus(true);


        clearTimeout(
            typingTimer
        );


        typingTimer =
            setTimeout(
                function() {

                    sendTypingStatus(false);

                },
                1200
            );
    }
);


/* =========================
   ENTER TO SEND
========================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================
   COPY LINK
========================= */

copyButton.addEventListener(
    "click",
    async function() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );


            copyButton.textContent =
                "✓ Copied!";


            setTimeout(
                function() {

                    copyButton.textContent =
                        "🔗 Copy Link";

                },
                1500
            );


        } catch {

            alert(
                "Copy failed. Copy the URL manually."
            );
        }
    }
);

</script>
