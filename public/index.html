<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LinkChat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#login {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: #1e293b;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

#joinButton {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
}

#joinButton:hover {
    background: #2563eb;
}

#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}

header {
    height: 75px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-title {
    font-size: 20px;
    font-weight: bold;
}

.status {
    font-size: 13px;
    margin-top: 3px;
}

.connected {
    color: #4ade80;
}

.disconnected {
    color: #f87171;
}

.connecting {
    color: #facc15;
}

#copyButton {
    background: #334155;
    color: white;
    border: 0;
    padding: 10px 14px;
    border-radius: 9px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 75%;
    background: #1e293b;
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 12px;
}

.message.mine {
    background: #2563eb;
    margin-left: auto;
}

.name {
    font-size: 12px;
    color: #93c5fd;
    margin-bottom: 4px;
    font-weight: bold;
}

.mine .name {
    color: #dbeafe;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.message-time {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 5px;
}

.mine .message-time {
    color: #bfdbfe;
}
.system {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 12px;
}

#composer {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#messageInput {
    flex: 1;
}

#sendButton {
    background: #3b82f6;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    font-weight: bold;
}

#sendButton:disabled {
    opacity: .5;
    cursor: not-allowed;
}

@media (max-width: 600px) {

    header {
        padding: 0 12px;
    }

    .chat-title {
        font-size: 17px;
    }

    #messages {
        padding: 15px;
    }

    .message {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬 LinkChat
        </div>

        <div class="subtitle">
            Create a room and share the link.
        </div>

        <label>Your name</label>

        <input
            id="username"
            maxlength="30"
            placeholder="Enter your name"
            autocomplete="off"
        >

        <label>Room name</label>

        <input
            id="room"
            maxlength="50"
            placeholder="Example: Chat"
            autocomplete="off"
        >

        <button id="joinButton">
            Join Chat
        </button>

    </div>

</div>


<!-- CHAT -->

<div id="chat">

    <header>

        <div class="header-left">

            <div>

                <div class="chat-title">
                    💬 <span id="roomTitle"></span>
                </div>

                <div id="status" class="status connecting">
                    🟡 Connecting...
                </div>

                <div class="status">
                    👥 <span id="userCount">0</span> online
                </div>

            </div>

        </div>

        <button id="copyButton">
            🔗 Copy Link
        </button>

    </header>


    <div id="messages"></div>


    <div id="composer">

        <input
            id="messageInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
        >

        <button id="sendButton" disabled>
            Send
        </button>

    </div>

</div>


<script>

const login = document.getElementById("login");
const chat = document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const roomInput =
    document.getElementById("room");

const joinButton =
    document.getElementById("joinButton");

const roomTitle =
    document.getElementById("roomTitle");

const statusElement =
    document.getElementById("status");

const userCount =
    document.getElementById("userCount");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const copyButton =
    document.getElementById("copyButton");


let socket = null;

let username = "";

let room = "";

let reconnectTimer = null;

let manuallyDisconnected = false;


/* Get room from URL */

const urlParams =
    new URLSearchParams(window.location.search);

const urlRoom =
    urlParams.get("room");

if (urlRoom) {
    roomInput.value = urlRoom;
}


/* Change connection status */

function setStatus(type, text) {

    statusElement.className =
        "status " + type;

    statusElement.textContent =
        text;
}


/* Add a normal message */

function addMessage(name, message, mine, time) {

    const box = document.createElement("div");
    box.className = "message";

    if (mine) {
        box.classList.add("mine");
    }

    const nameElement = document.createElement("div");
    nameElement.className = "name";
    nameElement.textContent = name;

    const messageElement = document.createElement("div");
    messageElement.className = "message-text";
    messageElement.textContent = message;

    const timeElement = document.createElement("div");
    timeElement.className = "message-time";

    if (time) {
        const date = new Date(time);

        timeElement.textContent =
            date.toLocaleDateString() +
            " " +
            date.toLocaleTimeString([], {
                hour: "numeric",
                minute: "2-digit"
            });
    }

    box.appendChild(nameElement);
    box.appendChild(messageElement);
    box.appendChild(timeElement);

    messages.appendChild(box);

    messages.scrollTop = messages.scrollHeight;
}
    const box =
        document.createElement("div");

    box.className =
        "message";

    if (mine) {
        box.classList.add("mine");
    }


    const nameElement =
        document.createElement("div");

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    const messageElement =
        document.createElement("div");

    messageElement.className =
        "message-text";

    messageElement.textContent =
        message;


    box.appendChild(nameElement);

    box.appendChild(messageElement);

    messages.appendChild(box);

    messages.scrollTop =
        messages.scrollHeight;
}


/* Add system message */

function addSystemMessage(text) {

    const element =
        document.createElement("div");

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;
}


/* Enable / disable composer */

function setComposerEnabled(enabled) {

    messageInput.disabled =
        !enabled;

    sendButton.disabled =
        !enabled;
}


/* Connect to server */

function connect() {

    clearTimeout(reconnectTimer);

    setStatus(
        "connecting",
        "🟡 Connecting..."
    );


    /*
       IMPORTANT:
       Use wss:// for HTTPS.
       Use ws:// for HTTP.
    */

    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const websocketURL =
        protocol +
        "//" +
        window.location.host;


    console.log(
        "Connecting to:",
        websocketURL
    );


    try {

        socket =
            new WebSocket(websocketURL);

    } catch (error) {

        console.error(error);

        setStatus(
            "disconnected",
            "🔴 Connection failed"
        );

        scheduleReconnect();

        return;
    }


    socket.addEventListener(
        "open",
        function() {

            console.log(
                "WebSocket connected"
            );


            setStatus(
                "connected",
                "🟢 Connected"
            );


            socket.send(
                JSON.stringify({
                    type: "join",
                    username: username,
                    room: room
                })
            );


            setComposerEnabled(true);

            messageInput.focus();
        }
    );


    socket.addEventListener(
        "message",
        function(event) {

            let data;


            try {

                data =
                    JSON.parse(event.data);

            } catch (error) {

                console.error(
                    "Invalid server message",
                    error
                );

                return;
            }


            console.log(
                "Server:",
                data
            );


            if (data.type === "joined") {

                roomTitle.textContent =
                    data.room;

                return;
            }


            if (data.type === "message") {

                addMessage(
    data.username,
    data.message,
    data.username === username,
    data.time
);
                );

                return;
            }


            if (data.type === "system") {

                addSystemMessage(
                    data.message
                );

                return;
            }


            if (data.type === "users") {

                userCount.textContent =
                    data.count;

                return;
            }


            if (data.type === "error") {

                addSystemMessage(
                    "Server error: " +
                    data.message
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        function() {

            console.log(
                "WebSocket disconnected"
            );


            setComposerEnabled(false);


            setStatus(
                "disconnected",
                "🔴 Disconnected"
            );


            if (!manuallyDisconnected) {

                addSystemMessage(
                    "Connection lost. Reconnecting..."
                );

                scheduleReconnect();
            }

        }
    );


    socket.addEventListener(
        "error",
        function(error) {

            console.error(
                "WebSocket error:",
                error
            );


            setStatus(
                "disconnected",
                "🔴 Connection error"
            );

        }
    );
}


/* Automatic reconnect */

function scheduleReconnect() {

    clearTimeout(reconnectTimer);


    reconnectTimer =
        setTimeout(
            function() {

                connect();

            },
            3000
        );
}


/* Join room */

function joinChat() {

    username =
        usernameInput.value.trim();

    room =
        roomInput.value.trim();


    if (!username) {

        alert(
            "Please enter your name."
        );

        usernameInput.focus();

        return;
    }


    if (!room) {

        alert(
            "Please enter a room name."
        );

        roomInput.focus();

        return;
    }


    history.replaceState(
        {},
        "",
        "?room=" +
        encodeURIComponent(room)
    );


    login.style.display =
        "none";

    chat.style.display =
        "flex";


    roomTitle.textContent =
        room;


    manuallyDisconnected =
        false;


    connect();
}


/* Send message */

function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        addSystemMessage(
            "You are not connected."
        );

        return;
    }


    socket.send(
        JSON.stringify({
            type: "message",
            message: message
        })
    );


    messageInput.value = "";

    messageInput.focus();
}


/* Join button */

joinButton.addEventListener(
    "click",
    joinChat
);


/* Send button */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* Enter to join */

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }

    }
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }

    }
);


/* Enter to send */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* Copy room URL */

copyButton.addEventListener(
    "click",
    async function() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );


            copyButton.textContent =
                "✓ Copied!";


            setTimeout(
                function() {

                    copyButton.textContent =
                        "🔗 Copy Link";

                },
                1500
            );

        } catch (error) {

            alert(
                "Copy failed. Copy the URL manually."
            );

        }

    }
);

</script>

</body>
</html>
