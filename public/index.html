<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LinkChat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
}


/* LOGIN */

#login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: #1e293b;
    padding: 35px;
    border-radius: 18px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitle {
    color: #94a3b8;
    margin: 8px 0 25px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

.password-help {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 6px;
}

#joinButton {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}


/* CHAT */

#chat {
    display: none;
    height: 100vh;
    flex-direction: column;
}


/* HEADER */

header {
    height: 72px;
    flex-shrink: 0;
    background: #1e293b;
    border-bottom: 1px solid #334155;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 18px;
}

.chat-title {
    font-size: 20px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    margin-top: 4px;
}

.connected {
    color: #4ade80;
}

.disconnected {
    color: #f87171;
}

.connecting {
    color: #facc15;
}

#copyButton {
    border: none;
    background: #334155;
    color: white;
    padding: 10px 14px;
    border-radius: 9px;
    cursor: pointer;
}


/* CHAT AREA */

.chat-area {
    flex: 1;
    display: flex;
    min-height: 0;
}


/* MESSAGES */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 75%;
    background: #1e293b;
    padding: 11px 14px;
    border-radius: 14px;
    margin-bottom: 12px;
}

.message.mine {
    margin-left: auto;
    background: #2563eb;
}

.name {
    font-size: 12px;
    color: #93c5fd;
    font-weight: bold;
    margin-bottom: 5px;
}

.mine .name {
    color: #dbeafe;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message-time {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 6px;
}

.mine .message-time {
    color: #bfdbfe;
}


/* ACTIONS */

.message-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.message-actions button {
    border: none;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: white;
    background: rgba(255,255,255,.15);
    cursor: pointer;
}

.edited-label {
    font-size: 10px;
    margin-left: 5px;
    opacity: .8;
}


/* SYSTEM */

.system {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 12px;
}


/* ONLINE */

#onlinePanel {
    width: 230px;
    flex-shrink: 0;

    background: #111827;
    border-left: 1px solid #334155;

    padding: 18px;

    overflow-y: auto;
}

.online-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

.online-count {
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 15px;
}

.online-user {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 8px 5px;

    font-size: 14px;
}

.online-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4ade80;
    flex-shrink: 0;
}


/* TYPING INDICATOR */

#typingIndicator {
    min-height: 22px;
    padding: 0 20px;

    color: #94a3b8;

    font-size: 12px;

    background: #1e293b;
}


/* COMPOSER */

#composer {
    display: flex;
    gap: 10px;

    padding: 15px;

    background: #1e293b;
    border-top: 1px solid #334155;
}

#messageInput {
    flex: 1;
}

#sendButton {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;

    background: #3b82f6;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

#sendButton:disabled {
    opacity: .5;
}


/* MOBILE */

@media (max-width: 700px) {

    #onlinePanel {
        display: none;
    }

    .message {
        max-width: 88%;
    }

    #messages {
        padding: 15px;
    }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            💬 LinkChat
        </div>

        <div class="subtitle">
            Create a room and share the link.
        </div>


        <label>Your name</label>

        <input
            id="username"
            maxlength="30"
            placeholder="Enter your name"
            autocomplete="off"
        >


        <label>Room name</label>

        <input
            id="room"
            maxlength="100"
            placeholder="Example: Friends"
            autocomplete="off"
        >


        <label>Room password</label>

        <input
            id="password"
            type="password"
            maxlength="100"
            placeholder="Leave blank for no password"
            autocomplete="off"
        >

        <div class="password-help">
            For a new room, the first password becomes the room password.
        </div>


        <button id="joinButton">
            Join Chat
        </button>

    </div>

</div>


<!-- CHAT -->

<div id="chat">


    <header>

        <div>

            <div class="chat-title">
                💬 <span id="roomTitle"></span>
            </div>

            <div
                id="status"
                class="status connecting"
            >
                🟡 Connecting...
            </div>

        </div>


        <button id="copyButton">
            🔗 Copy Link
        </button>

    </header>


    <div class="chat-area">

        <div id="messages"></div>


        <div id="onlinePanel">

            <div class="online-title">
                🟢 Online
            </div>

            <div
                class="online-count"
                id="onlineCount"
            >
                0 people online
            </div>

            <div id="onlineUsers"></div>

        </div>

    </div>


    <!-- TYPING -->

    <div id="typingIndicator"></div>


    <!-- COMPOSER -->

    <div id="composer">

        <input
            id="messageInput"
            maxlength="1000"
            placeholder="Type a message..."
            autocomplete="off"
            disabled
        >

        <button
            id="sendButton"
            disabled
        >
            Send
        </button>

    </div>

</div>


<script>


/* ELEMENTS */

const login =
    document.getElementById("login");

const chat =
    document.getElementById("chat");

const usernameInput =
    document.getElementById("username");

const roomInput =
    document.getElementById("room");

const passwordInput =
    document.getElementById("password");

const joinButton =
    document.getElementById("joinButton");

const roomTitle =
    document.getElementById("roomTitle");

const statusElement =
    document.getElementById("status");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const copyButton =
    document.getElementById("copyButton");

const onlineUsers =
    document.getElementById("onlineUsers");

const onlineCount =
    document.getElementById("onlineCount");

const typingIndicator =
    document.getElementById("typingIndicator");


/* VARIABLES */

let socket = null;

let username = "";

let room = "";

let password = "";

let typingTimer = null;

let currentlyTyping = new Set();


/* ROOM FROM URL */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlRoom =
    params.get("room");

if (urlRoom) {
    roomInput.value = urlRoom;
}


/* STATUS */

function setStatus(type, text) {

    statusElement.className =
        "status " + type;

    statusElement.textContent =
        text;

}


/* TIME */

function formatTime(time) {

    if (!time) {
        return "";
    }

    const date = new Date(time);

    const now = new Date();

    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return (
            "Today at " +
            date.toLocaleTimeString(
                [],
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            )
        );

    }

    return (
        date.toLocaleDateString(
            [],
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        ) +
        " at " +
        date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        )
    );

}


/* ADD MESSAGE */

function addMessage(
    name,
    message,
    mine,
    time,
    id
) {

    const box =
        document.createElement("div");

    box.className =
        "message";

    if (mine) {
        box.classList.add("mine");
    }

    box.dataset.id =
        String(id);


    const nameElement =
        document.createElement("div");

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    const messageElement =
        document.createElement("div");

    messageElement.className =
        "message-text";

    messageElement.textContent =
        message;


    const timeElement =
        document.createElement("div");

    timeElement.className =
        "message-time";

    timeElement.textContent =
        formatTime(time);


    box.appendChild(nameElement);
    box.appendChild(messageElement);
    box.appendChild(timeElement);


    /* EDIT / DELETE */

    if (mine) {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const editButton =
            document.createElement("button");

        editButton.textContent =
            "✏️ Edit";


        editButton.onclick =
            function() {

                const newMessage =
                    prompt(
                        "Edit your message:",
                        messageElement.textContent
                    );


                if (
                    newMessage === null
                ) {
                    return;
                }


                const trimmed =
                    newMessage.trim();


                if (!trimmed) {
                    return;
                }


                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "edit",
                            id: Number(id),
                            message: trimmed
                        })
                    );

                }

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "🗑️ Delete";


        deleteButton.onclick =
            function() {

                if (
                    !confirm(
                        "Delete this message?"
                    )
                ) {
                    return;
                }


                if (
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ) {

                    socket.send(
                        JSON.stringify({
                            type: "delete",
                            id: Number(id)
                        })
                    );

                }

            };


        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        box.appendChild(actions);

    }


    messages.appendChild(box);

    messages.scrollTop =
        messages.scrollHeight;

}


/* SYSTEM MESSAGE */

function addSystemMessage(text) {

    const element =
        document.createElement("div");

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;

}


/* ONLINE USERS */

function updateOnlineUsers(users) {

    onlineUsers.innerHTML = "";

    onlineCount.textContent =
        users.length === 1
            ? "1 person online"
            : `${users.length} people online`;


    users.forEach(function(name) {

        const user =
            document.createElement("div");

        user.className =
            "online-user";


        const dot =
            document.createElement("div");

        dot.className =
            "online-dot";


        const nameElement =
            document.createElement("span");

        nameElement.textContent =
            name === username
                ? name + " (you)"
                : name;


        user.appendChild(dot);
        user.appendChild(nameElement);

        onlineUsers.appendChild(user);

    });

}


/* TYPING DISPLAY */

function updateTypingIndicator() {

    const names =
        Array.from(currentlyTyping);


    if (names.length === 0) {

        typingIndicator.textContent =
            "";

        return;
    }


    if (names.length === 1) {

        typingIndicator.textContent =
            `${names[0]} is typing...`;

        return;
    }


    if (names.length === 2) {

        typingIndicator.textContent =
            `${names[0]} and ${names[1]} are typing...`;

        return;
    }


    typingIndicator.textContent =
        `${names.length} people are typing...`;

}


/* COMPOSER */

function setComposerEnabled(enabled) {

    messageInput.disabled =
        !enabled;

    sendButton.disabled =
        !enabled;

}


/* SEND TYPING STATUS */

function sendTypingStatus(isTyping) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {
        return;
    }


    socket.send(
        JSON.stringify({
            type: "typing",
            typing: isTyping
        })
    );

}


/* CONNECT */

function connect() {

    setStatus(
        "connecting",
        "🟡 Connecting..."
    );


    const protocol =
        window.location.protocol ===
        "https:"
            ? "wss:"
            : "ws:";


    socket =
        new WebSocket(
            protocol +
            "//" +
            window.location.host
        );


    socket.addEventListener(
        "open",
        function() {

            setStatus(
                "connected",
                "🟢 Connected"
            );


            socket.send(
                JSON.stringify({
                    type: "join",
                    username: username,
                    room: room,
                    password: password
                })
            );

        }
    );


    socket.addEventListener(
        "message",
        function(event) {

            let data;


            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            /* JOINED */

            if (
                data.type === "joined"
            ) {

                roomTitle.textContent =
                    data.room;

                setComposerEnabled(true);

                messageInput.focus();

                return;
            }


            /* PASSWORD */

            if (
                data.type ===
                "passwordError"
            ) {

                alert(
                    "Incorrect room password."
                );

                setComposerEnabled(false);

                chat.style.display =
                    "none";

                login.style.display =
                    "flex";

                passwordInput.focus();

                if (socket) {
                    socket.close();
                }

                return;
            }


            /* MESSAGE */

            if (
                data.type === "message"
            ) {

                addMessage(
                    data.username,
                    data.message,
                    data.username === username,
                    data.time,
                    data.id
                );

                return;
            }


            /* EDIT */

            if (
                data.type ===
                "messageEdited"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );


                if (element) {

                    const text =
                        element.querySelector(
                            ".message-text"
                        );

                    if (text) {

                        text.textContent =
                            data.message;

                        const label =
                            document.createElement(
                                "span"
                            );

                        label.className =
                            "edited-label";

                        label.textContent =
                            "(edited)";

                        text.appendChild(label);

                    }

                }

                return;
            }


            /* DELETE */

            if (
                data.type ===
                "messageDeleted"
            ) {

                const element =
                    document.querySelector(
                        `.message[data-id="${data.id}"]`
                    );

                if (element) {
                    element.remove();
                }

                return;
            }


            /* SYSTEM */

            if (
                data.type === "system"
            ) {

                addSystemMessage(
                    data.message
                );

                return;
            }


            /* ONLINE */

            if (
                data.type === "users"
            ) {

                updateOnlineUsers(
                    data.users || []
                );

                return;
            }


            /* TYPING */

            if (
                data.type === "typing"
            ) {

                if (data.typing) {

                    currentlyTyping.add(
                        data.username
                    );

                } else {

                    currentlyTyping.delete(
                        data.username
                    );

                }


                updateTypingIndicator();

                return;
            }


            /* ERROR */

            if (
                data.type === "error"
            ) {

                addSystemMessage(
                    data.message
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        function() {

            setComposerEnabled(false);

            setStatus(
                "disconnected",
                "🔴 Disconnected"
            );

        }
    );

}


/* JOIN */

function joinChat() {

    username =
        usernameInput.value.trim();

    room =
        roomInput.value.trim();

    password =
        passwordInput.value;


    if (!username) {

        alert(
            "Please enter your name."
        );

        usernameInput.focus();

        return;
    }


    if (!room) {

        alert(
            "Please enter a room name."
        );

        roomInput.focus();

        return;
    }


    history.replaceState(
        {},
        "",
        "?room=" +
        encodeURIComponent(room)
    );


    login.style.display =
        "none";

    chat.style.display =
        "flex";


    roomTitle.textContent =
        room;


    messages.innerHTML =
        "";

    onlineUsers.innerHTML =
        "";

    onlineCount.textContent =
        "0 people online";

    typingIndicator.textContent =
        "";

    currentlyTyping.clear();


    setComposerEnabled(false);

    connect();

}


/* SEND MESSAGE */

function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;
    }


    sendTypingStatus(false);


    socket.send(
        JSON.stringify({
            type: "message",
            message: message
        })
    );


    messageInput.value =
        "";

    messageInput.focus();

}


/* BUTTONS */

joinButton.addEventListener(
    "click",
    joinChat
);


sendButton.addEventListener(
    "click",
    sendMessage
);


/* ENTER TO JOIN */

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }

    }
);


roomInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            joinChat();
        }

    }
);


/* TYPING */

messageInput.addEventListener(
    "input",
    function() {

        sendTypingStatus(true);


        clearTimeout(
            typingTimer
        );


        typingTimer =
            setTimeout(
                function() {

                    sendTypingStatus(false);

                },
                1200
            );

    }
);


/* ENTER TO SEND */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* COPY LINK */

copyButton.addEventListener(
    "click",
    async function() {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );


            copyButton.textContent =
                "✓ Copied!";


            setTimeout(
                function() {

                    copyButton.textContent =
                        "🔗 Copy Link";

                },
                1500
            );


        } catch {

            alert(
                "Copy failed. Copy the URL manually."
            );

        }

    }
);

</script>

</body>

</html>
